name: Aggiorna catalogo Milan Radar

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "editorial/**"
      - "config/**"
      - "calciodove/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: aggiornamento-catalogo
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Aggiorna calendario, fonti e catalogo
        run: python scripts/aggiorna.py

      - name: Valida i dati pubblicabili
        run: |
          python scripts/valida.py
          python -m unittest discover -s tests -v

      - name: Salva soltanto dati validi
        run: |
          git config user.name "Milan Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aggiorna calendario e controlli TV"
            git push
          fi
